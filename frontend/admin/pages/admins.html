<!-- Clothify Admins Management -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Manage Admins — Clothify Admin</title>
  <link rel="stylesheet" href="../assets/css/nucleo-icons.css" />
  <link rel="stylesheet" href="../assets/css/nucleo-svg.css" />
  <link id="pagestyle" href="../assets/css/material-dashboard.css?v=3.2.0" rel="stylesheet" />
</head>
<body class="g-sidenav-show bg-gray-100">
  <aside class="sidenav navbar navbar-vertical navbar-expand-xs border-radius-lg fixed-start ms-2 bg-white my-2" id="sidenav-main">
    <div class="sidenav-header">
      <a class="navbar-brand px-4 py-3 m-0" href="../pages/dashboard.html">
        <img src="../assets/img/logo-clothify-dark.png" class="navbar-brand-img" width="26" height="26" alt="clothify_logo">
        <span class="ms-1 text-sm text-dark">Clothify</span>
      </a>
    </div>
    <hr class="horizontal dark mt-0 mb-2">
    <div class="collapse navbar-collapse w-auto" id="sidenav-collapse-main">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="../pages/dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="../pages/products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="../pages/orders.html">Orders</a></li>
        <li class="nav-item"><a class="nav-link" href="../pages/customers.html">Customers</a></li>
        <!-- New Admin Management Link Active Highlight -->
        <li class="nav-item"><a class="nav-link active bg-gradient-dark text-white" href="../pages/admins.html">Manage Admins</a></li>
      </ul>
    </div>
  </aside>
  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    <nav class="navbar navbar-main navbar-expand-lg px-0 mx-3 shadow-none border-radius-xl" id="navbarBlur" data-scroll="true">
      <div class="container-fluid py-1 px-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0 me-sm-6 me-5">
            <li class="breadcrumb-item text-sm"><a class="opacity-5 text-dark" href="javascript:;">Pages</a></li>
            <li class="breadcrumb-item text-sm text-dark active" aria-current="page">Manage Admins</li>
          </ol>
        </nav>
        <div class="collapse navbar-collapse mt-sm-0 mt-2 me-md-0 me-sm-4" id="navbar">
          <ul class="navbar-nav d-flex align-items-center justify-content-end">
            <!-- Modified Action Button to open creation modal -->
            <li class="nav-item d-flex align-items-center">
              <a class="btn btn-outline-primary btn-sm mb-0 me-3" href="javascript:;" onclick="openCreateModal()">Add New Admin</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container-fluid py-4">
      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-header pb-0 px-3">
              <h6 class="mb-0">Administrators</h6>
              <p class="text-sm">Manage dashboard administrative accounts and system privileges.</p>
            </div>
            <div class="card-body pt-4 p-3">
              <div class="table-responsive">
                <table class="table align-items-center mb-0">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Email</th>
                      <th>Roles</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="admins-table-body">
                    <!-- JavaScript will inject database rows here dynamically -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap Admin Form Modal Overlay -->
  <div class="modal fade" id="adminModal" tabindex="-1" aria-labelledby="adminModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title font-weight-normal" id="adminModalLabel">Add New Administrator</h5>
          <button type="button" class="btn-close text-dark" data-bs-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="adminForm">
            <!-- Hidden ID Input for Tracking Updates -->
            <input type="hidden" id="adminId">
            
            <div class="input-group input-group-outline my-3">
              <label class="form-label" for="adminName">Full Name</label>
              <input type="text" class="form-control" id="adminName" required>
            </div>
            
            <div class="input-group input-group-outline my-3" id="emailGroup">
              <label class="form-label" for="adminEmail">Email Address</label>
              <input type="email" class="form-control" id="adminEmail" required>
            </div>
            
            <div class="input-group input-group-outline my-3" id="passwordGroup">
              <label class="form-label" for="adminPassword">Password</label>
              <input type="password" class="form-control" id="adminPassword">
              <small class="text-muted w-100 d-none" id="passwordHelp">Leave blank to keep existing password</small>
            </div>

            <div class="my-3">
              <label class="text-xs font-weight-bold mb-2">System Privileges / Roles</label>
              <select class="form-select border px-2 py-2" id="adminRoles" required>
                <option value="ROLE_ADMIN">Standard Admin (ROLE_ADMIN)</option>
                <option value="ROLE_SUPER_ADMIN">Super Admin (ROLE_SUPER_ADMIN)</option>
              </select>
            </div>
            
            <div class="text-end mt-4">
              <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-dark bg-gradient-dark">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Core Template Script Assets -->
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>
  <script src="../assets/js/plugins/smooth-scrollbar.min.js"></script>
  <script src="../assets/js/plugins/chartjs.min.js"></script>
  <script src="../assets/js/material-dashboard.min.js?v=3.2.0"></script>
  
  <!-- Dedicated Internal UI Action Script Link -->
  <script src="../assets/js/dashboard/admin-management.js"></script>
</body>
</html>
