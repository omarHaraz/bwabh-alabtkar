<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | bwabhalabtkar</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Global Path Fix for GitHub Pages -->
    <script src="../customer/assets/js/global-path-fix.js"></script>

</head>

<body>

<header class="auth-topbar">
    <a href="../customer/pages/home.html" class="auth-topbar-brand">
        <i class="fa-solid fa-bolt"></i>
        <span>Innovation Hub</span>
    </a>
    <a href="../customer/pages/home.html" class="auth-topbar-link">Back to home</a>
</header>

<main class="auth-page">
    <section class="login-wrapper">

        <!-- ========================= -->
        <!-- Signup Card -->
        <!-- ========================= -->

        <div id="signupFormContainer" class="auth-card">

            <h2>Create Account</h2>

            <p class="subtitle">
                Join us and get started today.
            </p>

            <button class="btn-google" type="button">
                <i class="fa-brands fa-google"></i>
                Continue with Google
            </button>

            <div class="divider">
                <span>or</span>
            </div>

            <form id="signupForm" novalidate>

                <div
                    class="form-error"
                    id="formError"
                    role="alert"
                    hidden>
                </div>

                <!-- Name -->

                <div class="form-field">

                    <div class="input-container">

                        <input
                            type="text"
                            id="name"
                            placeholder="Full Name"
                            required>

                    </div>

                    <span
                        class="field-error"
                        id="nameError">
                    </span>

                </div>

                <!-- Email -->

                <div class="form-field">

                    <div class="input-container">

                        <input
                            type="email"
                            id="email"
                            placeholder="Email"
                            required>

                    </div>

                    <span
                        class="field-error"
                        id="emailError">
                    </span>

                </div>

                <!-- Password -->

                <div class="form-field">

                    <div class="input-container password-container">

                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required>

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword()"
                            aria-label="Toggle Password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                    <span
                        class="field-error"
                        id="passwordError">
                    </span>

                </div>

                <div class="form-options">

                    <label class="checkbox-container">

                        <input type="checkbox">

                        <span>Email me with news and offers</span>

                    </label>

                </div>

                <button
                    type="submit"
                    class="btn-primary">

                    Create Account

                </button>

            </form>

            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </p>

        </div>

        <!-- ========================= -->
        <!-- OTP Card -->
        <!-- ========================= -->

        <div
            id="otpSection"
            class="auth-card"
            style="display:none;">

            <h2>Email Verification</h2>

            <p class="subtitle">

                We sent a verification code to

            </p>

            <strong id="displayEmail"></strong>

            <div class="otp-container">

                <input class="otp-input" maxlength="1" inputmode="numeric">

                <input class="otp-input" maxlength="1" inputmode="numeric">

                <input class="otp-input" maxlength="1" inputmode="numeric">

                <input class="otp-input" maxlength="1" inputmode="numeric">

                <input class="otp-input" maxlength="1" inputmode="numeric">

                <input class="otp-input" maxlength="1" inputmode="numeric">

            </div>

            <span
                class="field-error"
                id="otpError">
            </span>

            <button
                class="btn-primary"
                type="button"
                onclick="verifyOtp()">

                Verify Email

            </button>

            <button
                id="resendBtn"
                class="btn-secondary"
                type="button">

                Resend OTP

            </button>

            <p class="signup-text">

                Wrong email?

                <a
                    href="/coming-soon.html"
                    onclick="window.location.href='/coming-soon.html'; return false;">

                    Change email

                </a>

            </p>

        </div>

    </section>
</main>

<script type="module" src="js/signup.js"></script>

</body>
</html>
