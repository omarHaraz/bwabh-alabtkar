<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | StyleSphere</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="auth-topbar">
    <a href="../customer/pages/home.html" class="auth-topbar-brand">
        <i class="fa-solid fa-bolt"></i>
        <span>Innovation Hub</span>
    </a>
    <a href="../customer/pages/home.html" class="auth-topbar-link">Back to home</a>
</header>

<main class="auth-page">
    <section class="login-wrapper">
        <div class="auth-card">
         


        <h2>Sign in</h2>
        <p class="subtitle">Welcome back! Please sign in to continue.</p>

        <button class="btn-google" type="button">
            <i class="fa-brands fa-google"></i>
            Continue with Google
        </button>

        <div class="divider">
            <span>or</span>
        </div>

        <form id="loginForm" novalidate>
            <div class="form-error" id="formError" role="alert" hidden></div>

            <!-- Email -->
            <div class="form-field">
                <div class="input-container">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email"
                        required
                    >
                </div>
                <span class="field-error" id="emailError"></span>
            </div>

            <!-- Password -->
            <div class="form-field">
                <div class="input-container password-container">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <span class="field-error" id="passwordError"></span>
            </div>

            <div class="form-options">
                <a href="forgot-password.html" class="forgot-password">
                    Forgot password?
                </a>
            </div>

            <button type="submit" class="btn-primary">
                Sign in
            </button>

        </form>

        <p class="signup-text">
            Don't have an account?
            <a href="signup.html">Create account</a>
        </p>
        </div>
    </section>
</main>

<script type="module" src="js/login.js"></script>

</body>
</html>
