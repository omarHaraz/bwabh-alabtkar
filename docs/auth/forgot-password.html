<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Global Path Fix for GitHub Pages -->
    <script src="../customer/assets/js/global-path-fix.js"></script>

</head>

<body>

<header class="auth-topbar">
    <a href="../customer/pages/home.html" class="auth-topbar-brand">
        <i class="fa-solid fa-bolt"></i>
        <span>Innovation Hub</span>
    </a>
    <a href="../customer/pages/home.html" class="auth-topbar-link">Back to home</a>
<main class="auth-page">
    <section class="login-wrapper">
        <div class="auth-card">

                <!-- Logo -->

                <div class="logo-container">

                    <h1>Forgot Password?</h1>

                    <p>
                        Enter your email address and we'll send you
                        a verification code to reset your password.
                    </p>

                </div>

                <!-- Form Error -->

                <div
                    id="formError"
                    class="form-error"
                    hidden>
                </div>

                <!-- Form -->

                <form id="forgotPasswordForm">

                    <div class="form-field">

                        <div class="input-container">

                            <input
                                type="email"
                                id="email"
                                placeholder="Email Address"
                                autocomplete="email">

                        </div>

                        <span
                            id="emailError"
                            class="field-error">
                        </span>

                    </div>

                    <button
                        type="submit"
                        class="btn-primary">

                        Send Verification Code

                    </button>

                </form>

                <!-- Footer -->

                <p class="signup-text">

                    Remember your password?

                    <a href="login.html">

                        Sign In

                    </a>

                </p>

            </div>
    </section>
</main>

    <script
        type="module"
        src="js/forgot-password.js">
    </script>

</body>

</html>
