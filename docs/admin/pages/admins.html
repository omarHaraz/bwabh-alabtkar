<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manage Admins</title>

  <!-- Fonts -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">

  <!-- Styles -->
  <link rel="stylesheet" href="../assets/css/nucleo-icons.css">
  <link rel="stylesheet" href="../assets/css/nucleo-svg.css">
  <link rel="stylesheet" href="../assets/css/material-dashboard.css?v=3.2.0">
  <link rel="stylesheet" href="../assets/css/dashboard-responsive.css">


  <style>
    .main-content {
      margin-left: 17rem;
      transition: all .3s ease;
    }

    @media (max-width: 1200px) {
      .main-content {
        margin-left: 0;
      }
    }
  </style>

</head>

<body class="g-sidenav-show bg-gray-100">

  <!-- Sidebar -->
  <div id="sidebar"></div>

  <!-- Main Content -->
  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Page Content -->
    <div class="container-fluid py-4">

      <div class="row">
        <div class="col-12">

          <div class="card">

            <div class="card-header pb-0">

              <div class="d-flex justify-content-between align-items-center">

                <div>
                  <h5 class="mb-1">Manage Administrators</h5>
                  <p class="text-sm mb-0">
                    Create, update and manage administrator accounts.
                  </p>
                </div>

                <button
                  class="btn bg-gradient-dark mb-0"
                  onclick="openCreateModal()">

                  <i class="material-symbols-rounded text-sm">add</i>
                  &nbsp;Add Admin

                </button>

              </div>

            </div>

            <div class="card-body px-0 pb-2">

              <div class="table-responsive">

                <table class="table align-items-center mb-0">

                  <thead>

                    <tr>

                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                        Name
                      </th>

                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">
                        Email
                      </th>

                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">
                        Role
                      </th>

                      <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                        Status
                      </th>

                      <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                        Actions
                      </th>

                    </tr>

                  </thead>

                  <tbody id="admins-table-body">
                    <!-- Loaded by JavaScript -->
                  </tbody>

                </table>

              </div>

            </div>

          </div>

        </div>
      </div>

    </div>

  </main>

  <!-- Admin Modal -->
  <div class="modal fade" id="adminModal" tabindex="-1" aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title" id="adminModalLabel">
            Add New Administrator
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close">
          </button>

        </div>

        <div class="modal-body">

          <form id="adminForm">

            <input type="hidden" id="adminId">

            <div class="mb-3">
              <label class="form-label text-xs font-weight-bold text-dark ms-1 mb-1">Full Name</label>
              <div class="input-group input-group-outline">
                <input
                  type="text"
                  id="adminName"
                  class="form-control px-3"
                  placeholder="e.g. John Doe"
                  required>
              </div>
            </div>

            <div class="mb-3" id="emailGroup">
              <label class="form-label text-xs font-weight-bold text-dark ms-1 mb-1">Email Address</label>
              <div class="input-group input-group-outline">
                <input
                  type="email"
                  id="adminEmail"
                  class="form-control px-3"
                  placeholder="name@bwabhalabtkar.com"
                  required>
              </div>
            </div>

            <div class="mb-3" id="passwordGroup">
              <label class="form-label text-xs font-weight-bold text-dark ms-1 mb-1">Password</label>
              <div class="input-group input-group-outline">
                <input
                  type="password"
                  id="adminPassword"
                  class="form-control px-3"
                  placeholder="••••••••">
              </div>
              <small
                id="passwordHelp"
                class="text-muted text-xs ms-1 mt-1 d-none">
                Leave blank to keep the current password.
              </small>
            </div>

            <div class="mb-3">
              <label class="form-label text-xs font-weight-bold text-dark ms-1 mb-1">
                Role
              </label>
              <select
                id="adminRoles"
                class="form-select px-3"
                required>
                <option value="ROLE_ADMIN">
                  Standard Admin
                </option>
                <option value="ROLE_SUPER_ADMIN">
                  Super Admin
                </option>
              </select>
            </div>

            <div class="text-end">

              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal">
                Cancel
              </button>

              <button
                type="submit"
                class="btn bg-gradient-dark">
                Save
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

  <!-- Core JS -->
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>

  <!-- Load Shared Components -->
  <script src="../assets/js/loadComponents.js"></script>

  <script src="../assets/js/dashboard-responsive.js"></script>


  <!-- Admin Page Logic -->
  <script type="module" src="../assets/js/dashboard/admin-management.js"></script>

</body>

</html>
