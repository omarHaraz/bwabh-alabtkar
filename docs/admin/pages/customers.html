<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Customers</title>

  <!-- Fonts -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">

  <!-- Styles -->
  <link rel="stylesheet" href="../assets/css/nucleo-icons.css">
  <link rel="stylesheet" href="../assets/css/nucleo-svg.css">
  <link rel="stylesheet" href="../assets/css/material-dashboard.css?v=3.2.0">
  <link rel="stylesheet" href="../assets/css/dashboard-responsive.css">
  
  <style>
    .main-content {
      margin-left: 17rem;
      transition: all .3s ease;
    }

    @media (max-width:1200px) {
      .main-content {
        margin-left: 0;
      }
    }
  </style>

</head>

<body class="g-sidenav-show bg-gray-100">

  <!-- Sidebar -->
  <div id="sidebar"></div>

  <!-- Main Content -->
  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Page Content -->
    <div class="container-fluid py-4">

      <div class="row">
        <div class="col-12">

          <div class="card">

            <div class="card-header pb-0">

              <div class="d-flex justify-content-between align-items-center">

                <div>
                  <h5 class="mb-1">Customers</h5>
                  <p class="text-sm mb-0">
                    Manage registered customer accounts.
                  </p>
                </div>

              </div>

            </div>

            <div class="card-body px-0 pb-2">

              <div class="table-responsive">

                <table class="table align-items-center mb-0">

                  <thead>

                    <tr>

                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                        Name
                      </th>

                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">
                        Email
                      </th>

                      <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                        Status
                      </th>

                      <th class="text-center text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">
                        Actions
                      </th>

                    </tr>

                  </thead>

                  <tbody id="customers-table-body">
                    <!-- Loaded by JavaScript -->
                  </tbody>

                </table>

              </div>

            </div>

          </div>

        </div>
      </div>

    </div>

  </main>

  <!-- Customer Modal -->
  <div class="modal fade"
       id="customerModal"
       tabindex="-1"
       aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title" id="customerModalLabel">
            Edit Customer
          </h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close">
          </button>

        </div>

        <div class="modal-body">

          <form id="customerForm">

            <input type="hidden" id="customerId">

            <div class="input-group input-group-outline my-3">

              <label class="form-label">
                Full Name
              </label>

              <input
                type="text"
                class="form-control"
                id="customerName"
                required>

            </div>

            <div class="input-group input-group-outline my-3">

              <label class="form-label">
                Email
              </label>

              <input
                type="email"
                class="form-control"
                id="customerEmail"
                required>

            </div>

            <div class="input-group input-group-outline my-3">

              <label class="form-label">
                Password
              </label>

              <input
                type="password"
                class="form-control"
                id="customerPassword">

              <small
                id="passwordHelp"
                class="text-muted d-none">
                Leave blank to keep existing password.
              </small>

            </div>

            <div class="text-end">

              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal">
                Cancel
              </button>

              <button
                type="submit"
                class="btn bg-gradient-dark">
                Save
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

  <!-- Core JS -->
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>

  <!-- Shared Components -->
  <script src="../assets/js/loadComponents.js"></script>

  <script src="../assets/js/dashboard-responsive.js"></script>


  <!-- Customer Page -->
  <script src="../assets/js/dashboard/customer-management.js"></script>

</body>

</html>
